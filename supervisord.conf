[supervisord]
nodaemon=true
user=rails
logfile=/rails/log/supervisord.log
pidfile=/rails/tmp/supervisord.pid

[program:web]
command=./bin/thrust ./bin/rails server -b 0.0.0.0 -p %(ENV_PORT)s
directory=/rails
user=rails
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/rails/log/web.log
stderr_logfile=/rails/log/web.log
environment=RAILS_ENV="production"

[program:jobs]
command=./bin/jobs
directory=/rails
user=rails
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/rails/log/jobs.log
stderr_logfile=/rails/log/jobs.log
environment=RAILS_ENV="production"